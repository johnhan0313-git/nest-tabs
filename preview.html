<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>嵌套标签预览</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body class="preview">
    <div id="app"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const now = Date.now();
      const empty = params.get("empty") === "1";
      const mem = {
        seq: 20,
        state: empty ? {
          version: 1,
          rev: 1,
          roots: [],
          temps: [],
          settings: { tempTtlHours: 24 },
        } : {
          version: 1,
          rev: 1,
          settings: { tempTtlHours: 24 },
          roots: [
            {
              type: "folder",
              id: "f-pay",
              name: "支付组",
              color: "#3d6dff",
              collapsed: false,
              children: [
                { type: "pin", id: "p-lib", url: "https://artifacts.example.com", customName: "制品库", favIconUrl: "" },
                { type: "pin", id: "p-code", url: "https://code.example.com", customName: "代码库", favIconUrl: "" },
                {
                  type: "folder",
                  id: "f-test",
                  name: "测试环境",
                  color: "#7c4dff",
                  collapsed: false,
                  children: [
                    { type: "pin", id: "p-matrix", url: "https://matrix.example.com", customName: "Matrix Admin", favIconUrl: "" },
                  ],
                },
              ],
            },
            {
              type: "folder",
              id: "f-prod",
              name: "生产环境",
              color: "#e84393",
              collapsed: true,
              children: [
                { type: "pin", id: "p-ops", url: "https://ops.example.com", customName: "支付中台运营系统", favIconUrl: "" },
              ],
            },
          ],
          temps: [
            { id: "t-docs", tabId: 11, windowId: 1, url: "https://docs.example.com/open", liveTitle: "支付中台开放平台", customName: "", favIconUrl: "", openedAt: now - 2 * 3600000 },
            { id: "t-mq", tabId: 12, windowId: 1, url: "https://mq.example.com", liveTitle: "rocketmq", customName: "", favIconUrl: "", openedAt: now - 23.2 * 3600000 },
          ],
        },
        tabs: empty ? [] : [
          { id: 11, windowId: 1, url: "https://docs.example.com/open", title: "支付中台开放平台", active: true },
          { id: 12, windowId: 1, url: "https://mq.example.com", title: "rocketmq", active: false },
          { id: 13, windowId: 1, url: "https://matrix.example.com", title: "Matrix Admin", active: false },
          { id: 14, windowId: 1, index: 2, groupId: 7, url: "chrome://newtab/", title: "新标签页", active: false },
          { id: 15, windowId: 1, index: 3, groupId: 7, url: "https://grafana.example.com", title: "应用监控-grafana", active: false },
          { id: 16, windowId: 1, index: 4, groupId: 8, url: "https://ops.example.com", title: "支付中台运营系统", active: false },
        ],
        groups: [
          { id: 7, windowId: 1, title: "监控", color: "cyan", collapsed: false },
          { id: 8, windowId: 1, title: "生产环境", color: "red", collapsed: true },
        ],
      };
      const listeners = { storage: [], tabs: {} };
      function emit(name, arg) {
        for (const fn of listeners.tabs[name] || []) fn(arg);
      }
      globalThis.chrome = {
        storage: {
          local: {
            async get() {
              return { state: structuredClone(mem.state) };
            },
            async set(obj) {
              mem.state = structuredClone(obj.state);
              for (const fn of listeners.storage) fn({ state: { newValue: mem.state } }, "local");
            },
          },
          onChanged: { addListener(fn) { listeners.storage.push(fn); } },
        },
        tabs: {
          async query(query) {
            let list = mem.tabs.slice();
            if (query && query.active) list = list.filter((tab) => tab.active);
            if (query && query.currentWindow) list = list.filter((tab) => tab.windowId === 1);
            return structuredClone(list);
          },
          async update(id, props) {
            if (props.active) {
              for (const tab of mem.tabs) tab.active = tab.id === id;
            }
            emit("onActivated", { tabId: id, windowId: 1 });
            return mem.tabs.find((tab) => tab.id === id);
          },
          async create(props) {
            const tab = { id: ++mem.seq, windowId: 1, url: props.url, title: props.url, active: true };
            for (const item of mem.tabs) item.active = false;
            mem.tabs.push(tab);
            emit("onCreated", tab);
            return tab;
          },
          async remove(id) {
            const ids = Array.isArray(id) ? id : [id];
            mem.tabs = mem.tabs.filter((tab) => !ids.includes(tab.id));
            for (const item of ids) emit("onRemoved", item);
          },
          async duplicate(id) {
            const source = mem.tabs.find((tab) => tab.id === id);
            if (!source) throw new Error("missing");
            const tab = { ...source, id: ++mem.seq, active: true };
            for (const item of mem.tabs) item.active = false;
            mem.tabs.push(tab);
            emit("onCreated", tab);
            return tab;
          },
          onActivated: { addListener(fn) { (listeners.tabs.onActivated ||= []).push(fn); } },
          onUpdated: { addListener(fn) { (listeners.tabs.onUpdated ||= []).push(fn); } },
          onRemoved: { addListener(fn) { (listeners.tabs.onRemoved ||= []).push(fn); } },
          onCreated: { addListener(fn) { (listeners.tabs.onCreated ||= []).push(fn); } },
        },
        windows: {
          async getCurrent() { return { id: 1 }; },
          async update() {},
        },
        tabGroups: {
          async query() { return structuredClone(mem.groups || []); },
        },
        history: {
          async getVisits({ url }) {
            if (String(url).includes("matrix")) return [{ visitTime: now - 60000 }];
            if (String(url).includes("artifacts")) return [{ visitTime: now - 14 * 86400000 }];
            if (String(url).includes("code")) return [{ visitTime: now - 28 * 86400000 }];
            return [];
          },
          async search({ text }) {
            const all = [
              { url: "https://ops.example.com", title: "支付中台运营系统", lastVisitTime: now - 4 * 86400000 },
              { url: "https://mse.example.com", title: "mse", lastVisitTime: now - 6 * 86400000 },
              { url: "https://k8s.example.com", title: "k8s", lastVisitTime: now - 7 * 86400000 },
              { url: "https://grafana.example.com", title: "应用监控-grafana", lastVisitTime: now - 8 * 86400000 },
            ];
            const q = String(text || "").toLowerCase();
            return all.filter((item) => item.title.toLowerCase().includes(q) || item.url.includes(q));
          },
        },
        runtime: {},
      };
      globalThis.__mem = mem;
    </script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
